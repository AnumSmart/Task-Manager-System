# Конфигурация Outbox Relay для user-service
# Определяет параметры вычитки и отправки событий из outbox таблицы

# Интервал опроса базы данных для поиска новых PENDING событий
# Формат: число + единица измерения (s, ms, m)
# Рекомендации:
#   - 100ms для высоконагруженных систем
#   - 1s для стандартных (значение по умолчанию)
#   - 5s для слабонагруженных
poll_interval: 1s

# Максимальное количество событий, вычитываемых за один раз
# Влияет на нагрузку БД и скорость обработки
# Рекомендации:
#   - 10-50 для слабых серверов
#   - 50-200 для стандартных (значение по умолчанию: 100)
#   - 200-500 для мощных
batch_size: 100

# Таймаут на публикацию одного события в RabbitMQ
# Если за это время событие не опубликовано, операция прерывается
# Рекомендации:
#   - 5s для стандартных (значение по умолчанию)
#   - 10-15s для перегруженных брокеров
#   - 2-3s для высоконагруженных (быстрый отказ)
publish_timeout: 5s
