# ============================================================================
# RABBITMQ КОНФИГУРАЦИЯ ДЛЯ USER-SERVICE
# ============================================================================

# URL подключения к RabbitMQ (AMQP протокол)
# Формат: amqp://[user]:[password]@[host]:[port]/
# Пример: amqp://taskms_user:pass@localhost:5672/
url: '${RABBITMQ_URL}'

# Имя exchange (обменника) - все сервисы публикуют события сюда
# Все микросервисы используют один exchange для событий
exchange_name: 'taskms.events'

# Тип exchange - topic позволяет гибкую маршрутизацию через wildcard (*, #)
# * - одно слово, # - ноль или более слов
exchange_type: 'topic'

# Сохранять exchange и очередь после перезапуска RabbitMQ
# true = данные не потеряются, false = временные (только для разработки)
durable: true

# Имя очереди для этого сервиса. Каждый сервис создаёт свою очередь
# Суффикс окружения позволяет разделять очереди dev/prod
queue_name: 'user-service-${ENVIRONMENT:-development}'

# Ключ маршрутизации для подписки. user.# значит получать все события о пользователях
# Пример: user.created, user.updated, user.telegram_linked и т.д.
routing_key: 'user.#'

# Максимальное количество повторных попыток при ошибке обработки
# После исчерпания сообщение уходит в DLQ (Dead Letter Queue)
max_retries: 3

# Задержка между повторными попытками (формат: 1s, 500ms, 2m)
# Даёт время восстановиться временно недоступному ресурсу
retry_delay: 5s

# Задержка перед попыткой переподключения при потере соединения с RabbitMQ
reconnect_delay: 3s

# Dead Letter Queue - очередь для сообщений, не прошедших обработку после всех retry
# Позволяет позже проанализировать ошибки и переопубликовать сообщения
dlq_name: 'user-service-${ENVIRONMENT:-development}.dlq'

# Режим подтверждения публикации. true = гарантия доставки сообщения (но медленнее)
# Включайте для важных событий (user.created, user.role_changed)
enable_confirm_mode: true

# Количество сообщений, обрабатываемых параллельно (QoS prefetch)
# 10 = хороший баланс для большинства сервисов
prefetch_count: 10

# Уникальный идентификатор потребителя (отображается в админке RabbitMQ)
# Помогает отслеживать, какой инстанс сервиса потребляет сообщения
consumer_tag: 'user-service-${ENVIRONMENT:-development}'
