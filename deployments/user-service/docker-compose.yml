services:
  # База данных сервиса авторизации
  postgres:
    container_name: postgres_go
    image: postgres:16.4
    environment:
      - 'POSTGRES_USER=${DB_USER}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_DB=${DB_NAME}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432' # Для локальных серверов
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache сервер
  redis_cache:
    container_name: redis_cache_go
    image: redis:7-alpine
    command: redis-server
      --requirepass ${REDIS_CACHE_PASSWORD}
      --port 6379
      --maxclients 10000
      --timeout 0
      --tcp-keepalive 300
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379' # Для локальных серверов
    volumes:
      - redis_cache_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_CACHE_PASSWORD}',
          '-p',
          '6379',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis blacklist сервер
  redis_blacklist:
    container_name: redis_blacklist_go
    image: redis:7-alpine
    command: redis-server
      --requirepass ${REDIS_BLACKLIST_PASSWORD}
      --port 6380
      --maxclients 10000
      --timeout 0
      --tcp-keepalive 300
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - '6380:6380' # Для локальных серверов
    volumes:
      - redis_blacklist_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_BLACKLIST_PASSWORD}',
          '-p',
          '6380',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
volumes:
  postgres_data:
  redis_cache_data:
  redis_blacklist_data:

networks:
  app-network:
    driver: bridge
